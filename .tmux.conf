set -g history-limit 50000

set -g mouse on

setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1

set -sg escape-time 10

# Do not rely on terminal clipboard escape sequences.
set -g set-clipboard off

# Copy tmux selection to X11 clipboard with Enter in copy mode.
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Also allow y to copy, like Vim.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Optional: copy with mouse drag release when mouse mode is enabled.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Change prefix from <C-b> to <C-a>
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g status-style 'bg=terminal, fg=terminal'
